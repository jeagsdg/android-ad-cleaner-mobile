plugins { id 'com.android.application' }
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('.local/signing.properties')
if (releasePropertiesFile.exists()) releasePropertiesFile.withInputStream { releaseProperties.load(it) }
def offlineOnly = providers.gradleProperty('offlineOnly').map { it.toBoolean() }.getOrElse(false)
android {
    namespace 'app.clearscreen'
    compileSdk 35
    defaultConfig {
        applicationId 'app.clearscreen'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.9.0'
        testInstrumentationRunner 'app.clearscreen.DeviceChecks'
        resValue 'bool', 'network_filter_available', offlineOnly ? 'false' : 'true'
    }
    sourceSets {
        main.java.srcDir(offlineOnly ? 'src/offline/java' : 'src/network/java')
        if (!offlineOnly) {
            debug.manifest.srcFile 'src/network/AndroidManifest.xml'
            release.manifest.srcFile 'src/network/AndroidManifest.xml'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        if (releasePropertiesFile.exists()) localRelease {
            storeFile file(releaseProperties.getProperty('storeFile'))
            storePassword releaseProperties.getProperty('storePassword')
            keyAlias releaseProperties.getProperty('keyAlias')
            keyPassword releaseProperties.getProperty('keyPassword')
        }
    }
    buildTypes { release { minifyEnabled false; if (releasePropertiesFile.exists()) signingConfig signingConfigs.localRelease } }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.12.2' }
tasks.withType(Test).configureEach {
    systemProperty 'clearscreen.artifacts', rootProject.file('artifacts').absolutePath
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
}
