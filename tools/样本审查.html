<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline'"><title>净屏 · 样本审查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f1;color:#193b2e;font:16px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid #c9d3c7;padding-bottom:24px}h1{font-size:clamp(26px,4vw,42px);margin:0;letter-spacing:-.04em}p{margin:6px 0;color:#475d52}label.pick,button{border:none;border-radius:8px;padding:10px 16px;background:#155c46;color:white;cursor:pointer;font:inherit}.pick:focus-within{outline:3px solid #628dd5}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}section{margin-top:24px;display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,1.6fr);gap:28px}.pane{min-width:0}svg{background:white;width:100%;height:56vh;border:1px solid #cfdbcf;border-radius:12px}input[type=search]{width:100%;padding:10px;border:1px solid #91a99a;border-radius:8px;font:inherit}ol{list-style:none;padding:0;max-height:48vh;overflow:auto}li button{display:block;width:100%;color:inherit;background:transparent;border-bottom:1px solid #d8e0d7;border-radius:0;text-align:left;overflow-wrap:anywhere}li button[aria-pressed=true]{background:#d9eadd}code{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px}#status{margin-top:18px}button:focus-visible,input:focus-visible{outline:3px solid #498aab}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}section{grid-template-columns:1fr}svg{height:30vh}}</style>
<main><header><div><h1>页面样本审查</h1><p>打开净屏导出的 JSON，在控件树里定位广告。文件只在本机读取。</p></div><label class="pick">打开样本<input id="file" type="file" accept=".json,application/json"></label></header><p id="status" role="status">尚未打开文件</p><section hidden id="workspace"><div class="pane"><svg id="map" role="img" aria-label="控件位置示意"></svg><code id="detail"></code></div><div class="pane"><input id="query" type="search" aria-label="查找控件" placeholder="按 ID、类名或广告文字查找"><ol id="rows"></ol></div></section></main>
<script>
'use strict';const el=id=>document.getElementById(id);let model,selected=-1;
function paint(){const all=model.nodes;const filtered=all.map((x,i)=>[x,i]).filter(([x])=>[x.id,x.class,x.text,x.desc].join(' ').toLowerCase().includes(el('query').value.toLowerCase()));el('rows').replaceChildren();for(const [x,i] of filtered){let li=document.createElement('li'),btn=document.createElement('button');btn.textContent='#'+i+'　'+(x.text||x.desc||x.id||x.class);btn.setAttribute('aria-pressed',String(i===selected));btn.onclick=()=>select(i);li.append(btn);el('rows').append(li);}el('status').textContent=model.package+' · '+(model.activity||'页面未知')+' · '+filtered.length+' / '+all.length+' 个控件';draw();}
function select(i){selected=i;paint();}
function draw(){let svg=el('map');svg.replaceChildren();let b=model.nodes.map(x=>x.bounds).filter(a=>a[2]>a[0]&&a[3]>a[1]);if(!b.length)return;let l=Math.min(...b.map(a=>a[0])),t=Math.min(...b.map(a=>a[1])),r=Math.max(...b.map(a=>a[2])),d=Math.max(...b.map(a=>a[3]));svg.setAttribute('viewBox',[l,t,r-l,d-t].join(' '));for(let idx of [...model.nodes.keys(),selected]){let n=model.nodes[idx];if(!n)continue;const [x,y,u,v]=n.bounds;if(u<=x||v<=y)continue;const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,val] of Object.entries({x,y,width:u-x,height:v-y,fill:idx===selected?'#71ab8266':'none',stroke:idx===selected?'#005c41':'#c9d5ca','vector-effect':'non-scaling-stroke'}))rect.setAttribute(k,val);svg.append(rect);}
let n=model.nodes[selected];el('detail').textContent=n?'#'+selected+' '+n.class+'\n'+(n.id||'无资源 ID')+'\n'+(n.clickable?'可点击':'未暴露点击动作')+' · 子节点 '+n.children.join(', '):'选一个控件查看位置';}
el('query').oninput=()=>model&&paint();el('workspace').style.display='none';el('file').onchange=async()=>{try{let f=el('file').files[0];if(!f)return;if(f.size>4194304)throw 0;let j=JSON.parse(await f.text());if(j.schema!=='clearscreen.sample.1'||!Array.isArray(j.nodes)||j.nodes.length>4096||!j.nodes.every(n=>n&&Array.isArray(n.children)&&Array.isArray(n.bounds)&&n.bounds.length===4&&n.bounds.every(Number.isFinite)))throw 0;model=j;selected=-1;el('query').value='';el('detail').textContent='';el('workspace').style.display='grid';paint();}catch(e){model=null;el('workspace').style.display='none';el('status').textContent='无法打开。请选择净屏导出的页面样本 JSON。';}};
</script></html>
